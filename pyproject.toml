[project]
name = "PDC"
version = "0.1.0"
description = "Piscine Data Science Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.7.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.6",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "pdfplumber>=0.11.8",
]

[tool.pyright]
typeCheckingMode = "basic"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false
